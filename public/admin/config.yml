backend:
  name: github
  repo: az-turf-suppliers/azturfsuppliers.com
  branch: main
  # base_url is where /api/auth and /api/callback live. These are Cloudflare
  # Pages Functions deployed from /functions/api/* in this repo.
  base_url: https://www.azturfsuppliers.com
  auth_endpoint: api/auth

# Where uploads (images) go when added through the CMS.
media_folder: public/media
public_folder: /media

# Default to "Working" mode (commit directly to main). Editors can toggle to
# Editorial Workflow later if you set up PR-based reviews.
publish_mode: simple

# Sveltia supports preview links from the CMS. Local previews need this set.
site_url: https://www.azturfsuppliers.com
display_url: https://www.azturfsuppliers.com
logo_url: /media/logo.png

collections:
  # ─────────────────────────────────────────────────────────────────────
  # Blog: editable Markdown posts. New posts are added through the CMS.
  # ─────────────────────────────────────────────────────────────────────
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}} — {{date | date(''MMM YYYY'')}}'
    sortable_fields: [date, title]
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - { name: title,        label: Title,             widget: string }
      - { name: description,  label: Meta Description,  widget: text,
          hint: 'Shown in Google search results and on social shares. Aim for 130–155 characters.' }
      - { name: category,     label: Category,          widget: select,
          options: [Installation, Maintenance, Buying Guide, Hardscape, News],
          default: Installation }
      - { name: date,         label: Publish Date,      widget: datetime, picker_utc: false }
      - { name: dateModified, label: Last Updated,      widget: datetime, picker_utc: false, required: false }
      - { name: readTime,     label: Read Time,         widget: string, default: '10 min read' }
      - { name: image,        label: Hero Image,        widget: image, media_library: { config: { multiple: false } } }
      - { name: imageAlt,     label: Hero Image Alt Text, widget: string, required: false,
          hint: 'Describes the image for screen readers and image search.' }
      - { name: lede,         label: Lede Paragraph,    widget: text,
          hint: 'First paragraph shown in large type under the title.' }
      - { name: draft,        label: Draft,             widget: boolean, default: false,
          hint: 'Drafts do not get built to the live site.' }
      - { name: body,         label: Body,              widget: markdown }

  # ─────────────────────────────────────────────────────────────────────
  # Site Configuration: phone, address, hours, social. Single file.
  # ─────────────────────────────────────────────────────────────────────
  - name: site_config
    label: Site Configuration
    files:
      - name: site
        label: Business Info
        file: src/data/site.json
        delete: false
        fields:
          - { name: name,             label: Business Name,         widget: string }
          - { name: phone,             label: 'Phone (display)',     widget: string,
              hint: 'Shown to humans, e.g. 480-739-3854' }
          - { name: phone_tel,         label: 'Phone (tel: link)',   widget: string,
              hint: 'Digits only, no dashes, e.g. 4807393854' }
          - { name: phone_sms,         label: 'Phone (SMS link)',    widget: string,
              hint: 'E.164 format, e.g. +14807393854' }
          - { name: email,             label: Email,                 widget: string }
          - { name: address_street,    label: Street Address,        widget: string }
          - { name: address_city,      label: City,                  widget: string }
          - { name: address_region,    label: State,                 widget: string }
          - { name: address_postal,    label: Postal Code,           widget: string }
          - { name: address_country,   label: Country Code,          widget: string, default: 'US' }
          - { name: hours_weekday,     label: 'Hours (display, weekdays)', widget: string }
          - { name: hours_weekend,     label: 'Hours (display, weekends)', widget: string }
          - { name: hours_opens,       label: 'Opens (24h, for schema)',   widget: string,
              hint: 'Used in LocalBusiness schema — e.g. 07:00' }
          - { name: hours_closes,      label: 'Closes (24h, for schema)',  widget: string }
          - { name: social_facebook,   label: Facebook URL,          widget: string }
          - { name: social_instagram,  label: Instagram URL,         widget: string }
          - { name: map_query,         label: Google Maps query,     widget: string,
              hint: 'URL-encoded address used to build the directions link.' }

  # ─────────────────────────────────────────────────────────────────────
  # Homepage: all editable content for the homepage. Sections cannot be
  # reordered or removed — only their contents can be edited.
  #
  # Body fields use a markdown widget restricted to bold/italic/link, so
  # editors get inline link insertion (for SEO/internal linking) without
  # being able to drop in headings, lists, or images that would break the
  # section's visual hierarchy.
  #
  # Headlines with italic emphasis use the convention `text *phrase*` —
  # the template renders `*phrase*` as <em>phrase</em>.
  # ─────────────────────────────────────────────────────────────────────
  - name: homepage_data
    label: Homepage
    files:
      - name: homepage
        label: Homepage
        file: src/data/homepage.json
        delete: false
        fields:
          # ── META ──
          - name: meta
            label: SEO / Meta
            widget: object
            collapsed: false
            fields:
              - { name: title,       label: Page Title,           widget: string,
                  hint: 'Browser tab + Google result title. 50–60 chars ideal.' }
              - { name: description, label: Meta Description,     widget: text,
                  hint: 'Shown in Google search snippet. 130–155 chars ideal.' }
              - { name: ogImage,     label: Social Share Image,   widget: image,
                  hint: 'Image shown when the page is shared on Facebook, LinkedIn, etc.' }

          # ── HERO ──
          - name: hero
            label: Hero (top of page)
            widget: object
            collapsed: true
            fields:
              - { name: fallbackImage, label: Fallback Image,    widget: image,
                  hint: 'Shown behind the YouTube video while it loads. Can also be an external URL.' }
              - { name: youtubeId,     label: YouTube Video ID,  widget: string,
                  hint: 'Just the 11-character ID, e.g. "kQDQYFjJAgA".' }
              - { name: heading,       label: Heading,           widget: text,
                  hint: 'Use newlines to split lines. Wrap a phrase in *asterisks* for italic emphasis.' }
              - { name: description,   label: Description,       widget: text }
              - { name: subtext,       label: Subtext (below buttons), widget: markdown,
                  modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
              - name: ctaPrimary
                label: Primary CTA Button
                widget: object
                fields:
                  - { name: text, label: Button Text, widget: string }
                  - { name: link, label: Button Link, widget: string }
              - name: ctaSecondary
                label: Secondary CTA Button
                widget: object
                fields:
                  - { name: text, label: Button Text, widget: string }
                  - { name: link, label: Button Link, widget: string }

          # ── TICKER ──
          - name: ticker
            label: Scrolling Ticker (orange bar under hero)
            widget: list
            collapsed: true
            field: { name: item, label: Item, widget: string }

          # ── WHO WE SERVE ──
          - name: serve
            label: 'Section: Who We Serve'
            widget: object
            collapsed: true
            fields:
              - { name: label,   label: Section Label,   widget: string }
              - { name: heading, label: Section Heading, widget: string,
                  hint: 'Use *asterisks* around any phrase you want italicized.' }
              - name: cards
                label: Cards
                widget: list
                fields:
                  - { name: image,    label: Image,           widget: image }
                  - { name: alt,      label: Image Alt Text,  widget: string }
                  - { name: heading,  label: Card Heading,    widget: string }
                  - { name: body,     label: Card Body,       widget: markdown,
                      modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
                  - { name: linkText, label: Link Text,       widget: string }
                  - { name: link,     label: Link URL,        widget: string }

          # ── PRODUCTS ──
          - name: products
            label: 'Section: Our Products'
            widget: object
            collapsed: true
            fields:
              - { name: label,    label: Section Label,    widget: string }
              - { name: heading,  label: Section Heading,  widget: string }
              - { name: intro,    label: Intro Paragraph,  widget: markdown,
                  modes: [rich_text], buttons: [bold, italic, link], editor_components: [],
                  hint: 'Good place for internal links to product/category pages.' }
              - name: cards
                label: Product Cards
                widget: list
                fields:
                  - { name: image,    label: Image,         widget: image }
                  - { name: alt,      label: Image Alt,     widget: string }
                  - { name: heading,  label: Heading,       widget: string }
                  - { name: subtitle, label: Subtitle,      widget: string }
                  - { name: link,     label: Link URL,      widget: string }
              - { name: closing,  label: Closing Paragraph, widget: markdown,
                  modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }

          # ── SHOP WITH CONFIDENCE ──
          - name: confidence
            label: 'Section: Shop With Confidence'
            widget: object
            collapsed: true
            fields:
              - { name: bgImage,     label: Background Image, widget: image }
              - { name: heading,     label: Heading,          widget: string }
              - { name: subheading,  label: Subheading,       widget: string }
              - name: items
                label: Trust Items
                widget: list
                fields:
                  - name: icon
                    label: Icon
                    widget: select
                    options: &icon_options [
                      arrow-right, arrow-up-right, briefcase, building, calculator, calendar,
                      chart-up, chat, check, check-circle, chevron-down, chevron-up, clipboard,
                      clock, close, document, dollar, eye, fire, globe, handshake, hard-hat,
                      heart, home, leaf, lightbulb, lightning, location, mail, map, menu,
                      message, minus, mountain, package, paw, phone, play, plus, price-tag,
                      rocket, savings, search, shield, shield-check, sparkle, squares, star,
                      storefront, sun, target, thumbs-up, tools, trending-up, trophy, truck,
                      user, users, water-drop, wrench
                    ]
                  - { name: label, label: Label Text, widget: string }

          # ── CONTRACTOR DETAIL ──
          - name: contractor
            label: 'Section: For Contractors'
            widget: object
            collapsed: true
            fields:
              - { name: label,     label: Section Label,    widget: string }
              - { name: heading,   label: Section Heading,  widget: string }
              - { name: body,      label: Body Paragraph,   widget: markdown,
                  modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
              - { name: image,     label: Section Image,    widget: image }
              - { name: imageAlt,  label: Image Alt Text,   widget: string }
              - name: items
                label: Feature Items (4 items)
                widget: list
                fields:
                  - { name: icon,    label: Icon,        widget: select, options: *icon_options }
                  - { name: heading, label: Heading,     widget: string }
                  - { name: body,    label: Body,        widget: markdown,
                      modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
              - name: cta
                label: Button
                widget: object
                fields:
                  - { name: text, label: Button Text, widget: string }
                  - { name: link, label: Button Link, widget: string }

          # ── HOMEOWNER DETAIL ──
          - name: homeowner
            label: 'Section: For Homeowners'
            widget: object
            collapsed: true
            fields:
              - { name: label,     label: Section Label,    widget: string }
              - { name: heading,   label: Section Heading,  widget: string }
              - { name: body,      label: Body Paragraph,   widget: markdown,
                  modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
              - { name: image,     label: Section Image,    widget: image }
              - { name: imageAlt,  label: Image Alt Text,   widget: string }
              - name: items
                label: Feature Items (4 items)
                widget: list
                fields:
                  - { name: icon,    label: Icon,        widget: select, options: *icon_options }
                  - { name: heading, label: Heading,     widget: string }
                  - { name: body,    label: Body,        widget: markdown,
                      modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
              - name: cta
                label: Button
                widget: object
                fields:
                  - { name: text, label: Button Text, widget: string }
                  - { name: link, label: Button Link, widget: string }

          # ── WHY TURF ──
          - name: whyTurf
            label: 'Section: Why You''ll Love Turf (accordion)'
            widget: object
            collapsed: true
            fields:
              - { name: label,    label: Section Label,    widget: string }
              - { name: heading,  label: Section Heading,  widget: string,
                  hint: 'Use *asterisks* for italic emphasis.' }
              - { name: image,    label: Section Image,    widget: image }
              - { name: imageAlt, label: Image Alt Text,   widget: string }
              - name: benefits
                label: Benefits
                widget: list
                fields:
                  - { name: icon,    label: Icon,        widget: select, options: *icon_options }
                  - { name: heading, label: Heading,     widget: string }
                  - { name: body,    label: Body,        widget: markdown,
                      modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }

          # ── CHOOSE TURF ──
          - name: chooseTurf
            label: 'Section: Why Choose Turf (cards)'
            widget: object
            collapsed: true
            fields:
              - { name: label,    label: Section Label,    widget: string }
              - { name: heading,  label: Section Heading,  widget: string }
              - name: cards
                label: Cards
                widget: list
                fields:
                  - { name: icon,    label: Icon,        widget: select, options: *icon_options }
                  - { name: heading, label: Heading,     widget: string }
                  - { name: body,    label: Body,        widget: markdown,
                      modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }

          # ── PROCESS ──
          - name: process
            label: 'Section: 3-Step Process'
            widget: object
            collapsed: true
            fields:
              - { name: label,    label: Section Label,    widget: string }
              - { name: heading,  label: Section Heading,  widget: string }
              - name: steps
                label: Steps
                widget: list
                fields:
                  - { name: number,  label: Step Number, widget: string }
                  - { name: heading, label: Heading,     widget: string }
                  - { name: body,    label: Body,        widget: markdown,
                      modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }

          # ── OTHER PRODUCTS ──
          - name: otherProducts
            label: 'Section: Other Products'
            widget: object
            collapsed: true
            fields:
              - { name: label,    label: Section Label,    widget: string }
              - { name: heading,  label: Section Heading,  widget: string }
              - name: cards
                label: Cards
                widget: list
                fields:
                  - { name: image,    label: Image,        widget: image }
                  - { name: alt,      label: Image Alt,    widget: string }
                  - { name: heading,  label: Heading,      widget: string }
                  - { name: body,     label: Body,         widget: markdown,
                      modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
                  - { name: linkText, label: Link Text,    widget: string }
                  - { name: link,     label: Link URL,     widget: string }

          # ── TESTIMONIALS ──
          - name: testimonials
            label: 'Section: Testimonials'
            widget: object
            collapsed: true
            fields:
              - { name: label,    label: Section Label,    widget: string }
              - { name: heading,  label: Section Heading,  widget: string }
              - { name: ctaText,  label: CTA Link Text,    widget: string }
              - { name: ctaLink,  label: CTA Link URL,     widget: string }

          # ── NO-BRAINER CTA ──
          - name: noBrainer
            label: 'Section: Final CTA'
            widget: object
            collapsed: true
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body,    label: Body,    widget: markdown,
                  modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
              - name: ctaPrimary
                label: Primary Button
                widget: object
                fields:
                  - { name: text, label: Button Text, widget: string }
                  - { name: link, label: Button Link, widget: string }
              - name: ctaSecondary
                label: Secondary Button
                widget: object
                fields:
                  - { name: text, label: Button Text, widget: string }
                  - { name: link, label: Button Link, widget: string }

          # ── CONTACT ──
          - name: contact
            label: 'Section: Contact'
            widget: object
            collapsed: true
            fields:
              - { name: label,       label: Section Label,    widget: string }
              - { name: heading,     label: Section Heading,  widget: string }
              - { name: body,        label: Body Paragraph,   widget: markdown,
                  modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
              - { name: formHeading, label: Form Heading,     widget: string }

  # ─────────────────────────────────────────────────────────────────────
  # Location Pages: one file per city. Add a new city by clicking "New
  # Location" — the filename becomes the URL slug (must match an existing
  # template page in src/pages/ to render on the live site).
  # ─────────────────────────────────────────────────────────────────────
  - name: locations
    label: Location Pages
    label_singular: Location Page
    folder: src/data/locations
    create: true
    delete: false
    extension: json
    format: json
    slug: '{{slug}}'
    identifier_field: name
    summary: '{{name}}'
    fields:
      - { name: name,      label: 'City Name (display)',  widget: string }
      - { name: heroImage, label: Hero Image,             widget: image }
      - name: meta
        label: SEO / Meta
        widget: object
        collapsed: false
        fields:
          - { name: title,       label: Page Title,       widget: string }
          - { name: description, label: Meta Description, widget: text }
          - { name: ogImage,     label: Social Share Image, widget: image, required: false }
      - name: hero
        label: Hero Section
        widget: object
        collapsed: true
        fields:
          - { name: eyebrow, label: Eyebrow,                widget: string }
          - { name: heading, label: Heading,                widget: string,
              hint: 'Use *asterisks* for italic emphasis.' }
          - { name: body,    label: Body,                   widget: text }
          - name: ctaPrimary
            label: Primary CTA
            widget: object
            fields:
              - { name: text, label: Button Text, widget: string }
              - { name: link, label: Button Link, widget: string }
          - name: ctaSecondary
            label: Secondary CTA
            widget: object
            fields:
              - { name: text, label: Button Text, widget: string }
              - { name: link, label: Button Link, widget: string }
      - name: statBar
        label: Stat Bar (4 items)
        widget: list
        collapsed: true
        fields:
          - { name: value, label: Value, widget: string }
          - { name: label, label: Label, widget: string }
      - name: products
        label: 'Section: Products'
        widget: object
        collapsed: true
        fields:
          - { name: label,   label: Section Label,    widget: string }
          - { name: heading, label: Section Heading,  widget: string }
          - { name: body,    label: Intro Paragraph,  widget: markdown,
              modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
          - name: cards
            label: Product Cards
            widget: list
            fields:
              - { name: heading,  label: Heading,    widget: string }
              - { name: body,     label: Body,       widget: markdown,
                  modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
              - { name: linkText, label: Link Text,  widget: string }
              - { name: link,     label: Link URL,   widget: string }
      - name: why
        label: 'Section: Why Choose Us Locally'
        widget: object
        collapsed: true
        fields:
          - { name: label,   label: Section Label,    widget: string }
          - { name: heading, label: Section Heading,  widget: string }
          - name: cards
            label: Cards
            widget: list
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body,    label: Body,    widget: markdown,
                  modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
      - name: cta
        label: 'Section: Final CTA'
        widget: object
        collapsed: true
        fields:
          - { name: label,   label: Section Label,    widget: string }
          - { name: heading, label: Section Heading,  widget: string }
          - { name: body,    label: Body,             widget: markdown,
              modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
          - name: buttons
            label: Buttons
            widget: list
            fields:
              - { name: text,   label: Button Text,         widget: string }
              - { name: link,   label: Button Link,         widget: string }
              - { name: style,  label: Style,               widget: select, options: [primary, dark, outline] }
              - { name: newTab, label: 'Open in new tab?',  widget: boolean, default: false, required: false }
      - name: nearby
        label: Nearby Cities (footer link list)
        widget: object
        collapsed: true
        fields:
          - { name: prefix, label: 'Prefix (e.g. "Also serving:")', widget: string }
          - name: links
            label: Links
            widget: list
            fields:
              - { name: name, label: 'Display Name',  widget: string }
              - { name: link, label: 'URL',           widget: string }

  # ─────────────────────────────────────────────────────────────────────
  # Turf Products: one file per turf product. Adding a new product
  # through the CMS creates a new JSON file under src/data/products/turf/
  # — the dynamic [slug].astro route picks it up on the next build.
  # ─────────────────────────────────────────────────────────────────────
  - name: turf_products
    label: Turf Products
    label_singular: Turf Product
    folder: src/data/products/turf
    create: true
    delete: false
    extension: json
    format: json
    slug: '{{slug}}'
    identifier_field: detail.displayName
    summary: '{{detail.displayName}} — {{detail.price}}{{detail.priceUnit}}'
    fields:
      - name: meta
        label: SEO / Meta
        widget: object
        collapsed: false
        fields:
          - { name: title,       label: Page Title,         widget: string }
          - { name: description, label: Meta Description,   widget: text }
          - { name: ogImage,     label: Social Share Image, widget: image }

      - name: productSchema
        label: Product JSON-LD (Search Result Data)
        widget: object
        collapsed: true
        hint: |
          Used by Google to show price + product info directly in search results.
          Keep description natural — Google penalizes keyword stuffing.
        fields:
          - { name: name,            label: Product Name,            widget: string }
          - { name: image,           label: Product Image,           widget: image }
          - { name: description,     label: Short Description,       widget: text }
          - { name: price,           label: 'Price (number only)',   widget: string,
              hint: 'Just the number, no $. Must match what is displayed below.' }
          - { name: priceValidUntil, label: 'Price Valid Until (YYYY-MM-DD)', widget: string }

      - { name: heroImage, label: Hero Background Image, widget: image }

      - name: hero
        label: Hero Section
        widget: object
        collapsed: true
        fields:
          - { name: eyebrow,  label: Eyebrow Label, widget: string }
          - { name: heading,  label: Heading (H1),  widget: string }
          - { name: body,     label: 'Hero Body (short — truncated description)', widget: text }
          - name: ctaPrimary
            label: Primary Button
            widget: object
            fields:
              - { name: text, label: Button Text, widget: string }
              - { name: link, label: Button Link, widget: string }
          - name: ctaSecondary
            label: Secondary Button
            widget: object
            fields:
              - { name: text, label: Button Text, widget: string }
              - { name: link, label: Button Link, widget: string }

      - { name: mainImage,    label: Main Product Image,    widget: image,
          hint: 'Filename relative to /media/, e.g. bermuda-side.png' }
      - { name: mainImageAlt, label: Main Image Alt Text,   widget: string }

      - name: detail
        label: Product Detail Section
        widget: object
        collapsed: true
        fields:
          - { name: label,       label: Section Label,        widget: string }
          - { name: displayName, label: Display Name (H2),    widget: string }
          - { name: price,       label: 'Display Price (e.g. $1.40)', widget: string }
          - { name: priceUnit,   label: 'Price Unit (e.g. / sq ft)',  widget: string }
          - { name: description, label: Long Description,     widget: markdown,
              modes: [rich_text], buttons: [bold, italic, link], editor_components: [] }
          - { name: bestFor,     label: 'Best For (short tagline)', widget: string }
          - name: ctaPrimary
            label: 'Detail Primary Button (under price)'
            widget: object
            fields:
              - { name: text, label: Button Text, widget: string }
              - { name: link, label: Button Link, widget: string }
          - { name: specSheetUrl, label: Spec Sheet PDF, widget: file,
              hint: 'PDF download for the spec sheet.' }

      - name: keySpecs
        label: 'Key Specs (4-up grid)'
        widget: list
        collapsed: true
        summary: '{{label}}: {{value}}'
        fields:
          - { name: label, label: Spec Label, widget: string }
          - { name: value, label: Spec Value, widget: string }

      - name: features
        label: Features (with icons)
