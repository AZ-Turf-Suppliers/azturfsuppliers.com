collections_config:
  homepage:
    path: src/pages
    name: Homepage
    icon: home
    glob:
      - "index.astro"
    url: "/"
    _enabled_editors:
      - visual
    disable_add: true

  main_pages:
    path: src/pages
    name: Pages
    icon: wysiwyg
    glob:
      - "about.astro"
      - "contact.astro"
      - "gallery.astro"
      - "products.astro"
      - "locations.astro"
      - "contractors.astro"
      - "homeowners.astro"
      - "turf-calculator.astro"
    url: "/[slug]/"
    _enabled_editors:
      - visual
    disable_add: true

  products:
    path: src/pages
    name: Product Pages
    icon: store
    glob:
      - "artificial-turf.astro"
      - "bermuda-blend-70.astro"
      - "bermuda-blend-93.astro"
      - "natural-blend-75.astro"
      - "natural-blend-84.astro"
      - "natural-stone.astro"
      - "pavers.astro"
      - "landscape-lighting.astro"
      - "putting-green.astro"
      - "spring-blend-87.astro"
      - "spring-blend-107.astro"
      - "winter-blend-84.astro"
      - "winter-blend-103.astro"
    url: "/[slug]/"
    _enabled_editors:
      - visual
    disable_add: true

  locations:
    path: src/pages
    name: Location Pages
    icon: location_on
    glob:
      - "apache-junction.astro"
      - "chandler.astro"
      - "gilbert.astro"
      - "mesa.astro"
      - "phoenix.astro"
      - "queen-creek.astro"
      - "san-tan-valley.astro"
      - "scottsdale.astro"
      - "tempe.astro"
    url: "/[slug]/"
    _enabled_editors:
      - visual
    disable_add: true

  data:
    path: src/data
    name: Data
    icon: settings
    glob:
      - "**/*.json"
    disable_url: true
    _enabled_editors:
      - data
    disable_add: true

collection_groups:
  - heading: Site
    collections:
      - homepage
      - main_pages
  - heading: Products
    collections:
      - products
  - heading: Locations
    collections:
      - locations
  - heading: Data
    collections:
      - data

paths:
  static: public
  uploads: public/media

data_config:
  gallery:
    path: src/data/gallery.json
  homepage:
    path: src/data/homepage.json

_inputs:
  overrides:
    type: object
    comment: "Add hover labels for gallery images. Key = exact filename (e.g. turf--01.jpg). Each entry can have a title and/or location."

  title:
    type: text
    comment: "Short label shown on hover in the gallery"

  location:
    type: text
    comment: "City or area shown on hover (e.g. Queen Creek, Chandler)"

  hero_fallback_image:
    type: image
    comment: "Fallback image shown behind the hero video while it loads"

  contractors_card_image:
    type: image
    comment: "Photo for the Contractors & Landscapers card"

  homeowners_card_image:
    type: image
    comment: "Photo for the DIY Homeowners card"

  turf_card_image:
    type: image
    comment: "Background photo for the Artificial Turf product card"

  pavers_card_image:
    type: image
    comment: "Background photo for the Pavers product card"

  stone_card_image:
    type: image
    comment: "Background photo for the Natural Stone product card"

  confidence_bg_image:
    type: image
    comment: "Background photo for the 'Shop With Confidence' section"

  contractor_detail_image:
    type: image
    comment: "Photo in the contractor detail section"

  homeowner_detail_image:
    type: image
    comment: "Photo in the homeowner detail section"

  why_turf_image:
    type: image
    comment: "Photo in the 'Why Turf' benefits section"

  pavers_other_image:
    type: image
    comment: "Photo for Pavers in the 'Other Products' section"

  stone_other_image:
    type: image
    comment: "Photo for Natural Stone in the 'Other Products' section"

  lighting_other_image:
    type: image
    comment: "Photo for Landscape Lighting in the 'Other Products' section"

  accessories_other_image:
    type: image
    comment: "Photo for Accessories in the 'Other Products' section"
